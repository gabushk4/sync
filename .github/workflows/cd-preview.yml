name: CD - Preview

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-preview
  cancel-in-progress: true
  
jobs:
  deploy:
    name: Preview (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Vérifier l'authentification
        run: eas whoami

      - name: Un build preview correspond-il au fingerprint ?
        id: check
        env:
          PLATFORM: ${{ matrix.platform }}
          PROFILE: preview
        run: |
          set -euo pipefail
          LOCAL=$(npx expo-updates fingerprint:generate --platform "$PLATFORM" | jq -r '.hash')
          echo "Fingerprint local: $LOCAL"

          eas build:list \
            --platform "$PLATFORM" \
            --build-profile "$PROFILE" \
            --status finished \
            --limit 20 \
            --json --non-interactive > builds.json

          if jq -r '.[].runtimeVersion' builds.json | grep -qx "$LOCAL"; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Natif inchangé -> update OTA
        if: steps.check.outputs.has_build == 'true'
        run: eas update --channel development --platform ${{ matrix.platform }} --message "dev ${{ github.sha }}" --non-interactive
      
      - name: Natif changé -> nouveau dev build
        if: steps.check.outputs.has_build == 'false'
        run: eas build --platform ${{ matrix.platform }} --profile development --non-interactive --no-wait
